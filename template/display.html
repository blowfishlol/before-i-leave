<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Michroma&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* ═══════════════════════════════════════════════════
       THEME — edit these to tweak the look
       ═══════════════════════════════════════════════════ */
    :root {
      --font: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-display: 'Michroma', sans-serif;
      /* clock only */
      --bg: #fff;
      --fg: #000;
      --muted: #000;
      --pad: 36px;
      --gap: 18px;

      --size-clock: 80px;
      --size-section-title: 42px;
      --size-line-header: 42px;
      --size-stop-header: 24px;
      --size-departure: 58px;
      --size-current-temp: 64px;
      --size-current-wind: 22px;
      --size-forecast-time: 24px;
      --size-forecast-temp: 42px;
      --size-forecast-wind: 20px;

      --icon-current: 110px;
      --icon-forecast: 68px;
    }

    /* ═══════════════════════════════════════════════════
       BASE
       ═══════════════════════════════════════════════════ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
    }

    body {
      display: flex;
      flex-direction: column;
      padding: var(--pad);
      gap: var(--gap);
    }

    /* ═══════════════════════════════════════════════════
       DEPARTURES
       ═══════════════════════════════════════════════════ */
    .departures {
      flex: 0 0 auto;
    }

    .section-title {
      font-size: var(--size-section-title);
      font-weight: 300;
      letter-spacing: 1px;
    }

    .departures-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .departures-columns {
      display: flex;
      gap: 40px;
      flex: 1;
    }

    .line-column {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .line-label {
      font-size: var(--size-section-title);
      font-weight: 300;
      letter-spacing: 1px;
      border-bottom: 2px solid var(--fg);
      padding-bottom: 5px;
      margin-bottom: 10px;
      position: relative;
      overflow: visible;
    }

    .line-label::after {
      content: '';
      position: absolute;
      left: 100%;
      bottom: -2px;
      width: 20px;
      height: 2px;
      background: var(--fg);
      transform-origin: left center;
      transform: rotate(-60deg);
    }

    .stop-columns {
      display: flex;
      gap: 20px;
      flex: 1;
    }

    .stop-column {
      flex: 1;
      min-width: 0;
    }

    .stop-header {
      font-size: var(--size-stop-header);
      font-weight: 600;
      color: var(--muted);
      border-bottom: 1px solid var(--fg);
      padding-bottom: 4px;
      margin-bottom: 10px;
      position: relative;
      overflow: visible;
    }

    .stop-header-text {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stop-header::after {
      content: '';
      position: absolute;
      left: 100%;
      bottom: -1px;
      width: 14px;
      height: 1px;
      background: var(--fg);
      transform-origin: left center;
      transform: rotate(-60deg);
    }

    .departures-grid {
      display: grid;
      grid-template-columns: auto auto 1fr;
      column-gap: 12px;
      row-gap: 12px;
      align-items: center;
      font-size: var(--size-departure);
      font-variant-numeric: tabular-nums;
    }

    .dep-mins {
      font-weight: 600;
      white-space: nowrap;
      line-height: 1;
    }

    .dep-unit {
      font-size: 0.3em;
      font-weight: 400;
      vertical-align: super;
      line-height: 0;
      margin-left: 0.3em;
    }

    .dep-secondary {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1px;
    }

    .dep-time {
      color: var(--muted);
      white-space: nowrap;
      font-size: var(--size-forecast-time);
      font-weight: 600;
      line-height: 1.2;
    }

    .dep-info {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: 0.22em;
      line-height: 1.3;
      font-style: italic;
      color: var(--muted);
      text-align: left;
      align-self: start;
    }

    .dep-occupancy {
      color: var(--muted);
      line-height: 1.2;
      font-size: 0.28em;
    }

    .clock {
      font-family: var(--font);
      font-size: var(--size-clock);
      font-weight: 300;
      letter-spacing: 2px;
      white-space: nowrap;
      line-height: 1;
      border-bottom: 1px solid var(--fg);
      padding-bottom: 8px;
    }

    .clock-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 6px;
      flex-shrink: 0;
      border-right: 1px solid var(--fg);
      padding-right: 28px;
    }

    .date {
      font-size: var(--size-section-title);
      font-weight: 300;
      letter-spacing: 1px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ═══════════════════════════════════════════════════
       DIVIDER
       ═══════════════════════════════════════════════════ */
    .divider {
      flex: 0 0 auto;
      height: 1.5px;
      background: var(--fg);
      position: relative;
      overflow: visible;
    }

    .divider::after {
      content: '';
      position: absolute;
      left: 100%;
      top: 0;
      width: 20px;
      height: 1.5px;
      background: var(--fg);
      transform-origin: left center;
      transform: rotate(-60deg);
    }

    /* ═══════════════════════════════════════════════════
       WEATHER
       ═══════════════════════════════════════════════════ */
    .weather {
      flex: 1;
      display: flex;
      flex-direction: row;
      min-height: 0;
      align-items: stretch;
      gap: 28px;
    }

    .weather-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      justify-content: flex-start;
      gap: 32px;
    }

    .weather-row {
      flex: 1;
      display: flex;
      min-height: 0;
      align-items: stretch;
      gap: 24px;
    }

    /* Current conditions — merged into clock block */
    .weather-current {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .current-temp {
      font-size: var(--size-current-temp);
      font-weight: 300;
      letter-spacing: -2px;
      line-height: 1;
    }

    .current-bottom {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .current-icon {
      flex-shrink: 0;
      width: var(--icon-current);
      height: var(--icon-current);
    }

    .current-icon svg,
    .fc-icon svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: grayscale(1) brightness(0);
    }

    .current-icon svg * {
      stroke-width: 1 !important;
    }

    .fc-icon svg * {
      stroke-width: 1.5 !important;
    }

    .current-wind {
      font-size: var(--size-current-wind);
      color: var(--muted);
    }

    /* Forecast columns */
    .forecast-columns {
      display: flex;
      width: 100%;
      justify-content: space-between;
      align-items: flex-start;
    }

    .forecast-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .fc-time {
      font-size: var(--size-forecast-time);
      font-weight: 600;
      color: var(--muted);
    }

    .fc-temp {
      font-size: var(--size-forecast-temp);
      font-variant-numeric: tabular-nums;
    }

    .fc-icon {
      width: var(--icon-forecast);
      height: var(--icon-forecast);
    }

    .fc-wind {
      font-size: var(--size-forecast-wind);
      color: var(--muted);
    }

    /* ═══════════════════════════════════════════════════
       UTILS
       ═══════════════════════════════════════════════════ */
    .empty {
      color: var(--muted);
      font-style: italic;
    }
  </style>
</head>

<body>

  <!-- DEPARTURES ─────────────────────────────────── -->
  <section class="departures">
    <div class="departures-columns" id="departures-columns"></div>
  </section>

  <div class="divider"></div>

  <!-- WEATHER ────────────────────────────────────── -->
  <section class="weather">
    <div class="clock-block">
      <div class="date" id="date"></div>
      <div class="clock" id="clock"></div>
      <div class="weather-current" id="weather-current"></div>
    </div>
    <div class="weather-content">
      <div class="section-title">Weather</div>
      <div class="forecast-columns" id="forecast-columns"></div>
    </div>
  </section>

  <!-- DATA_INJECT -->
  <script>
    // ═══════════════════════════════════════════════════
    // WEATHER ICONS — Bas Milius Meteocons line style
    // https://github.com/basmilius/weather-icons
    // ═══════════════════════════════════════════════════
    const CDN = 'https://cdn.jsdelivr.net/gh/basmilius/weather-icons/production/line/all'

    const ICON_MAP = {
      '01d': 'clear-day',
      '01n': 'clear-night',
      '02d': 'partly-cloudy-day',
      '02n': 'partly-cloudy-night',
      '03d': 'cloudy',
      '03n': 'cloudy',
      '04d': 'overcast-day',
      '04n': 'overcast-night',
      '09d': 'drizzle',
      '09n': 'drizzle',
      '10d': 'partly-cloudy-day-rain',
      '10n': 'partly-cloudy-night-rain',
      '11d': 'thunderstorms-day-with-rain',
      '11n': 'thunderstorms-night-with-rain',
      '13d': 'snow',
      '13n': 'snow',
      '50d': 'mist',
      '50n': 'mist',
    }

    const iconCache = new Map()

    async function getIcon(code) {
      const name = ICON_MAP[code] ?? ICON_MAP[code?.replace('n', 'd')] ?? 'cloudy'
      if (!iconCache.has(name)) {
        const res = await fetch(`${CDN}/${name}.svg`)
        iconCache.set(name, await res.text())
      }
      return iconCache.get(name)
    }

    // ═══════════════════════════════════════════════════
    // RENDER
    // ═══════════════════════════════════════════════════

    function formatMinutes(mins) {
      if (mins >= 60) {
        const h = Math.floor(mins / 60)
        return `${h}<span class="dep-unit">hour</span>`
      }
      return `${mins}<span class="dep-unit">min</span>`
    }

    function renderOccupancy(level) {
      const iconMap = { LOW: 'fa-user', MEDIUM: 'fa-user-group', HIGH: 'fa-users' }
      const icon = iconMap[level]
      if (!icon) return `<span class="dep-occupancy" style="visibility:hidden"><i class="fa-solid fa-user"></i></span>`
      return `<span class="dep-occupancy"><i class="fa-solid ${icon}"></i></span>`
    }

    function renderDepartures(list) {
      if (!list.length) return '<div class="empty">No departures</div>'
      const cells = list.flatMap(d => [
        `<span class="dep-mins">${formatMinutes(d.minutes)}</span>`,
        `<div class="dep-secondary">
          ${renderOccupancy(d.occupancy)}
          <span class="dep-time">${d.time}</span>
        </div>`,
        `<span class="dep-info">${[d.outlier ? `→${d.destination}` : '', d.messages?.[0] ?? ''].filter(Boolean).join(' · ')}</span>`,
      ])
      return `<div class="departures-grid">${cells.join('')}</div>`
    }

    function renderStopColumn(group) {
      return `
        <div class="stop-column">
          <div class="stop-header"><span class="stop-header-text">${group.label}</span></div>
          ${renderDepartures(group.departures)}
        </div>
      `
    }

    function renderLineColumn(label, icon, groups) {
      const iconHtml = icon ? `<i class="fa-solid fa-${icon}"></i> ` : ''
      return `
        <div class="line-column">
          <div class="line-label">${iconHtml}${label}</div>
          <div class="stop-columns">${groups.map(renderStopColumn).join('')}</div>
        </div>
      `
    }

    async function render(data) {
      document.getElementById('clock').textContent = data.currentTime
      document.getElementById('date').textContent = data.currentDate

      document.getElementById('departures-columns').innerHTML =
        renderLineColumn(data.departures.leftLabel, data.departures.leftIcon, data.departures.left) +
        renderLineColumn(data.departures.rightLabel, data.departures.rightIcon, data.departures.right)

      const currentIcon = await getIcon(data.weather.current.icon)
      document.getElementById('weather-current').innerHTML = `
        <div class="current-temp">${data.weather.current.temp}°C</div>
        <div class="current-bottom">
          <div class="current-icon">${currentIcon}</div>
          <div class="current-wind">${data.weather.current.wind} km/h</div>
        </div>
      `

      const forecastHtml = await Promise.all(data.weather.forecast.map(async f => {
        const icon = await getIcon(f.icon)
        return `
          <div class="forecast-col">
            <div class="fc-time">${f.time}</div>
            <div class="fc-temp">${f.temp}°C</div>
            <div class="fc-icon">${icon}</div>
            <div class="fc-wind">${f.wind} km/h</div>
          </div>
        `
      }))
      document.getElementById('forecast-columns').innerHTML = forecastHtml.join('')
    }

    // ─── Entry point ──────────────────────────────────────
    // window.DATA is injected by the server at render time.
    // When opening this file directly in a browser, mock data
    // is used so you can preview and edit the layout.
    // ──────────────────────────────────────────────────────
    const MOCK = {
      currentTime: '12:00',
      currentDate: 'Mon, 02 Jun',
      departures: {
        leftLabel: 'U6',
        leftIcon: 'train-subway',
        left: [
          {
            stopId: 'de:09162:1340:51:51',
            label: 'Implerstraße',
            departures: [
              { minutes: 5, time: '12:05', occupancy: 'LOW', destination: 'Implerstraße' },
              { minutes: 15, time: '12:15', occupancy: 'MEDIUM', destination: 'Implerstraße' },
              { minutes: 25, time: '12:25', occupancy: 'LOW', destination: 'Implerstraße' },
            ],
          },
          {
            stopId: 'de:09162:1340:51:52',
            label: 'Klinikum Großhadern',
            departures: [
              { minutes: 3, time: '12:03', occupancy: 'LOW', destination: 'Garching-Forschungszentrum', messages: ['Verspätung'], outlier: false },
              { minutes: 13, time: '12:13', occupancy: 'HIGH', destination: 'Fröttmaning', outlier: true },
              { minutes: 23, time: '12:23', occupancy: 'MEDIUM', destination: 'Garching-Forschungszentrum', outlier: false },
            ],
          },
        ],
        rightLabel: '63',
        rightIcon: 'bus-simple',
        right: [
          {
            stopId: 'de:09162:1340:1:1',
            label: 'Rotkreuzplatz',
            departures: [
              { minutes: 8, time: '12:08', occupancy: 'LOW', destination: 'Rotkreuzplatz' },
              { minutes: 18, time: '12:18', occupancy: 'MEDIUM', destination: 'Rotkreuzplatz' },
              { minutes: 28, time: '12:28', occupancy: 'LOW', destination: 'Rotkreuzplatz' },
            ],
          },
          {
            stopId: 'de:09162:1340:3:3',
            label: 'Forstenrieder Allee',
            departures: [
              { minutes: 4, time: '12:04', occupancy: 'UNKNOWN', destination: 'Forstenrieder Allee' },
              { minutes: 14, time: '12:14', occupancy: 'LOW', destination: 'Forstenrieder Allee' },
              { minutes: 24, time: '12:24', occupancy: 'LOW', destination: 'Forstenrieder Allee' },
            ],
          },
        ],
      },
      weather: {
        current: { temp: 15, wind: 10, icon: '01d' },
        forecast: [
          { time: '15:00', temp: 17, wind: 12, icon: '02d' },
          { time: '18:00', temp: 18, wind: 8, icon: '03d' },
          { time: '21:00', temp: 14, wind: 11, icon: '10d' },
          { time: '00:00', temp: 11, wind: 7, icon: '01n' },
          { time: '03:00', temp: 9, wind: 5, icon: '01n' },
          { time: '06:00', temp: 10, wind: 6, icon: '02d' },
        ],
      },
    }

    render(window.DATA ?? MOCK).catch(console.error);
  </script>
</body>

</html>
