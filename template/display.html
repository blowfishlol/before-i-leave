<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Michroma&display=swap"
    rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════
       THEME — edit these to tweak the look
       ═══════════════════════════════════════════════════ */
    :root {
      --font: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-display: 'Michroma', sans-serif;
      /* clock only */
      --bg: #fff;
      --fg: #000;
      --muted: #555;
      --pad: 36px;
      --gap: 18px;

      --size-clock: 54px;
      --size-section-title: 34px;
      --size-line-header: 42px;
      --size-stop-header: 20px;
      --size-departure: 40px;
      --size-current-temp: 68px;
      --size-current-wind: 19px;
      --size-forecast-time: 17px;
      --size-forecast-temp: 26px;
      --size-forecast-wind: 15px;

      --icon-current: 52px;
      --icon-forecast: 44px;
    }

    /* ═══════════════════════════════════════════════════
       BASE
       ═══════════════════════════════════════════════════ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
    }

    body {
      display: flex;
      flex-direction: column;
      padding: var(--pad);
      gap: var(--gap);
    }

    /* ═══════════════════════════════════════════════════
       DEPARTURES
       ═══════════════════════════════════════════════════ */
    .departures {
      flex: 0 0 auto;
    }

    .section-title {
      font-size: var(--size-section-title);
      font-weight: 700;
    }

    .departures-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .departures-columns {
      display: flex;
      gap: 40px;
      flex: 1;
    }

    .line-column {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .line-label {
      font-size: var(--size-line-header);
      font-weight: 700;
      border-bottom: 2px solid var(--fg);
      padding-bottom: 5px;
      margin-bottom: 10px;
      position: relative;
      overflow: visible;
    }

    .line-label::after {
      content: '';
      position: absolute;
      left: 100%;
      bottom: -2px;
      width: 20px;
      height: 2px;
      background: var(--fg);
      transform-origin: left center;
      transform: rotate(-60deg);
    }

    .stop-columns {
      display: flex;
      gap: 20px;
      flex: 1;
    }

    .stop-column {
      flex: 1;
      min-width: 0;
    }

    .stop-header {
      font-size: var(--size-stop-header);
      font-weight: 600;
      color: var(--muted);
      border-bottom: 1px solid #ccc;
      padding-bottom: 4px;
      margin-bottom: 10px;
      position: relative;
      overflow: visible;
    }

    .stop-header-text {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stop-header::after {
      content: '';
      position: absolute;
      left: 100%;
      bottom: -1px;
      width: 14px;
      height: 1px;
      background: #ccc;
      transform-origin: left center;
      transform: rotate(-60deg);
    }

    .departures-grid {
      display: grid;
      grid-template-columns: auto auto 1fr;
      column-gap: 12px;
      row-gap: 12px;
      align-items: center;
      font-size: var(--size-departure);
      font-variant-numeric: tabular-nums;
    }

    .dep-mins {
      font-weight: 600;
      white-space: nowrap;
      line-height: 1;
    }

    .dep-secondary {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1px;
    }

    .dep-time {
      color: var(--muted);
      white-space: nowrap;
      font-size: 0.38em;
      line-height: 1.2;
    }

    .dep-info {
      overflow: hidden;
      font-size: 0.38em;
      line-height: 1.2;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .dep-dest {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
    }

    .dep-message {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-style: italic;
    }

    .dep-occupancy {
      letter-spacing: 1px;
      color: var(--muted);
      line-height: 1.2;
      font-size: 0.38em;
    }

    .clock {
      font-family: var(--font);
      font-size: var(--size-clock);
      font-weight: 400;
      letter-spacing: 2px;
      white-space: nowrap;
      line-height: 1;
      padding-top: 2px;
    }

    .date {
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 1px;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
      margin-top: 6px;
    }

    /* ═══════════════════════════════════════════════════
       DIVIDER
       ═══════════════════════════════════════════════════ */
    .divider {
      flex: 0 0 auto;
      height: 1.5px;
      background: var(--fg);
      position: relative;
      overflow: visible;
    }

    .divider::after {
      content: '';
      position: absolute;
      left: 100%;
      top: 0;
      width: 20px;
      height: 1.5px;
      background: var(--fg);
      transform-origin: left center;
      transform: rotate(-60deg);
    }

    /* ═══════════════════════════════════════════════════
       WEATHER
       ═══════════════════════════════════════════════════ */
    .weather {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      justify-content: center;
    }

    .weather-row {
      flex: 1;
      display: flex;
      min-height: 0;
      align-items: stretch;
      gap: 24px;
    }

    /* Current conditions — left block */
    .weather-current {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      padding-right: 28px;
      border-right: 1.5px solid #ccc;
      min-width: 160px;
      align-self: stretch;
    }

    .current-temp {
      font-size: var(--size-current-temp);
      font-weight: 300;
      letter-spacing: -2px;
      line-height: 1;
    }

    .current-bottom {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .current-icon {
      width: var(--icon-current);
      height: var(--icon-current);
      flex-shrink: 0;
      display: block;
    }

    .weather-icon-img {
      width: 100%;
      height: 100%;
      display: block;
      filter: grayscale(1) brightness(0);
    }

    .current-wind {
      font-size: var(--size-current-wind);
      color: var(--muted);
    }

    /* Forecast columns */
    .forecast-columns {
      flex: 1;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 8px;
    }

    .forecast-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .fc-time {
      font-size: var(--size-forecast-time);
      font-weight: 600;
      color: var(--muted);
    }

    .fc-temp {
      font-size: var(--size-forecast-temp);
      font-variant-numeric: tabular-nums;
    }

    .fc-icon {
      width: var(--icon-forecast);
      height: var(--icon-forecast);
    }

    .fc-wind {
      font-size: var(--size-forecast-wind);
      color: var(--muted);
    }

    /* ═══════════════════════════════════════════════════
       UTILS
       ═══════════════════════════════════════════════════ */
    .empty {
      color: var(--muted);
      font-style: italic;
    }

    svg {
      display: block;
    }
  </style>
</head>

<body>

  <!-- DEPARTURES ─────────────────────────────────── -->
  <section class="departures">
    <div class="departures-header">
      <div class="section-title">Departures</div>
      <div>
        <div class="clock" id="clock"></div>
        <div class="date" id="date"></div>
      </div>
    </div>
    <div class="departures-columns" id="departures-columns"></div>
  </section>

  <div class="divider"></div>

  <!-- WEATHER ────────────────────────────────────── -->
  <section class="weather">
    <div class="section-title">Weather</div>
    <div class="weather-row">
      <div class="weather-current" id="weather-current"></div>
      <div class="forecast-columns" id="forecast-columns"></div>
    </div>
  </section>

  <!-- DATA_INJECT -->
  <script>
    // ═══════════════════════════════════════════════════
    // WEATHER ICONS — Bas Milius Meteocons (MIT license)
    // https://github.com/basmilius/weather-icons
    //
    // Maps OWM icon codes → icon names.
    // Browse all names at: https://bas.dev/work/meteocons
    // ═══════════════════════════════════════════════════
    const CDN = 'https://cdn.jsdelivr.net/gh/basmilius/weather-icons/production/line/all'

    const ICON_MAP = {
      '01d': 'clear-day',
      '01n': 'clear-night',
      '02d': 'partly-cloudy-day',
      '02n': 'partly-cloudy-night',
      '03d': 'cloudy',
      '03n': 'cloudy',
      '04d': 'overcast-day',
      '04n': 'overcast-night',
      '09d': 'drizzle',
      '09n': 'drizzle',
      '10d': 'partly-cloudy-day-rain',
      '10n': 'partly-cloudy-night-rain',
      '11d': 'thunderstorms-day-with-rain',
      '11n': 'thunderstorms-night-with-rain',
      '13d': 'snow',
      '13n': 'snow',
      '50d': 'mist',
      '50n': 'mist',
    }

    function getIcon(code) {
      const name = ICON_MAP[code] ?? ICON_MAP[code?.replace('n', 'd')] ?? 'cloudy'
      return `<img class="weather-icon-img" src="${CDN}/${name}.svg" alt="${name}">`
    }

    // ═══════════════════════════════════════════════════
    // RENDER
    // ═══════════════════════════════════════════════════

    function renderOccupancy(level) {
      const filled = { LOW: 1, MEDIUM: 2, HIGH: 3 }[level] ?? 0
      const visible = filled > 0
      return `<span class="dep-occupancy" style="${visible ? '' : 'visibility:hidden'}">${'▮'.repeat(filled)}${'▯'.repeat(3 - filled)}</span>`
    }

    function renderDepartures(list) {
      if (!list.length) return '<div class="empty">No departures</div>'
      const cells = list.flatMap(d => [
        `<span class="dep-mins">${d.minutes} Min</span>`,
        `<div class="dep-secondary">
          ${renderOccupancy(d.occupancy)}
          <span class="dep-time">${d.time}</span>
        </div>`,
        `<div class="dep-info">
          <span class="dep-dest" style="${d.outlier ? '' : 'visibility:hidden'}">${d.destination}</span>
          <span class="dep-message" style="${d.messages?.[0] ? '' : 'visibility:hidden'}">${d.messages?.[0] ?? ' '}</span>
        </div>`,
      ])
      return `<div class="departures-grid">${cells.join('')}</div>`
    }

    function renderStopColumn(group) {
      return `
        <div class="stop-column">
          <div class="stop-header"><span class="stop-header-text">${group.label}</span></div>
          ${renderDepartures(group.departures)}
        </div>
      `
    }

    function renderLineColumn(label, groups) {
      return `
        <div class="line-column">
          <div class="line-label">${label}</div>
          <div class="stop-columns">${groups.map(renderStopColumn).join('')}</div>
        </div>
      `
    }

    function render(data) {
      document.getElementById('clock').textContent = data.currentTime
      document.getElementById('date').textContent = data.currentDate

      document.getElementById('departures-columns').innerHTML =
        renderLineColumn(data.departures.leftLabel, data.departures.left) +
        renderLineColumn(data.departures.rightLabel, data.departures.right)

      document.getElementById('weather-current').innerHTML = `
        <div class="current-temp">${data.weather.current.temp}°C</div>
        <div class="current-bottom">
          <div class="current-icon">${getIcon(data.weather.current.icon)}</div>
          <div class="current-wind">${data.weather.current.wind} km/h</div>
        </div>
      `

      document.getElementById('forecast-columns').innerHTML = data.weather.forecast.map(f => `
        <div class="forecast-col">
          <div class="fc-time">${f.time}</div>
          <div class="fc-temp">${f.temp}°C</div>
          <div class="fc-icon">${getIcon(f.icon)}</div>
          <div class="fc-wind">${f.wind} km/h</div>
        </div>
      `).join('')
    }

    // ─── Entry point ──────────────────────────────────────
    // window.DATA is injected by the server at render time.
    // When opening this file directly in a browser, mock data
    // is used so you can preview and edit the layout.
    // ──────────────────────────────────────────────────────
    const MOCK = {
      currentTime: '12:00',
      currentDate: 'Mon, 02 Jun',
      departures: {
        leftLabel: 'U6',
        left: [
          {
            stopId: 'de:09162:1340:51:51',
            label: 'Implerstraße',
            departures: [
              { minutes: 5, time: '12:05', occupancy: 'LOW', destination: 'Implerstraße' },
              { minutes: 15, time: '12:15', occupancy: 'MEDIUM', destination: 'Implerstraße' },
              { minutes: 25, time: '12:25', occupancy: 'LOW', destination: 'Implerstraße' },
            ],
          },
          {
            stopId: 'de:09162:1340:51:52',
            label: 'Klinikum Großhadern',
            departures: [
              { minutes: 3, time: '12:03', occupancy: 'LOW', destination: 'Garching-Forschungszentrum', messages: ['Verspätung'], outlier: false },
              { minutes: 13, time: '12:13', occupancy: 'HIGH', destination: 'Fröttmaning', outlier: true },
              { minutes: 23, time: '12:23', occupancy: 'MEDIUM', destination: 'Garching-Forschungszentrum', outlier: false },
            ],
          },
        ],
        rightLabel: 'Bus 63',
        right: [
          {
            stopId: 'de:09162:1340:3:3',
            label: 'Forstenrieder Allee',
            departures: [
              { minutes: 4, time: '12:04', occupancy: 'UNKNOWN', destination: 'Forstenrieder Allee' },
              { minutes: 14, time: '12:14', occupancy: 'LOW', destination: 'Forstenrieder Allee' },
              { minutes: 24, time: '12:24', occupancy: 'LOW', destination: 'Forstenrieder Allee' },
            ],
          },
          {
            stopId: 'de:09162:1340:1:1',
            label: 'Rotkreuzplatz',
            departures: [
              { minutes: 8, time: '12:08', occupancy: 'LOW', destination: 'Rotkreuzplatz' },
              { minutes: 18, time: '12:18', occupancy: 'MEDIUM', destination: 'Rotkreuzplatz' },
              { minutes: 28, time: '12:28', occupancy: 'LOW', destination: 'Rotkreuzplatz' },
            ],
          },
        ],
      },
      weather: {
        current: { temp: 15, wind: 10, icon: '01d' },
        forecast: [
          { time: '15:00', temp: 17, wind: 12, icon: '02d' },
          { time: '18:00', temp: 18, wind: 8, icon: '03d' },
          { time: '21:00', temp: 14, wind: 11, icon: '10d' },
          { time: '00:00', temp: 11, wind: 7, icon: '01n' },
        ],
      },
    }

    render(window.DATA ?? MOCK);
  </script>
</body>

</html>
